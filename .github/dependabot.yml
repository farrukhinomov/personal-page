# Weekly dependency updates. Minor and patch updates come as one PR per
# ecosystem; each major version gets its own PR. Security updates are not
# grouped or delayed and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    # Only versions that have been public for two weeks, as with manual pins.
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    labels: [type:chore, area:ops]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)
    labels: [type:chore, area:ops]
